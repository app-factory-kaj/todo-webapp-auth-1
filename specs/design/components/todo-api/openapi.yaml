openapi: 3.0.3
info:
  title: Todo API
  version: 0.1.0
servers:
  - url: /

components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth2/authorize
          tokenUrl: /oauth2/token
          scopes:
            todos:read: The caller's own todo items
            todos:write: Create, edit, complete and delete the caller's own todo items
  schemas:
    TodoItem:
      type: object
      required: [id, title, completed, createdAt, updatedAt]
      properties:
        id: { type: string }
        title: { type: string }
        completed: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TodoItemCreate:
      type: object
      required: [title]
      properties:
        title: { type: string }
    TodoItemUpdate:
      type: object
      properties:
        title: { type: string }
        completed: { type: boolean }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }

security:
  - oauth2: []

paths:
  /me/todo-items:
    get:
      operationId: listMyTodoItems
      summary: The caller's todo items
      security:
        - oauth2: [todos:read]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: A page of the caller's todo items
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TodoItem' }
        '401':
          description: Missing or invalid sign-in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: createMyTodoItem
      summary: Create a new todo item for the caller
      security:
        - oauth2: [todos:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TodoItemCreate' }
      responses:
        '201':
          description: The created todo item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TodoItem' }
        '400':
          description: The title is missing or invalid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Missing or invalid sign-in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /me/todo-items/{todoItemId}:
    get:
      operationId: getMyTodoItem
      summary: A single todo item of the caller's
      security:
        - oauth2: [todos:read]
      parameters:
        - name: todoItemId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The todo item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TodoItem' }
        '401':
          description: Missing or invalid sign-in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No such todo item of the caller's
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    patch:
      operationId: updateMyTodoItem
      summary: Edit or complete a todo item of the caller's
      security:
        - oauth2: [todos:write]
      parameters:
        - name: todoItemId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TodoItemUpdate' }
      responses:
        '200':
          description: The updated todo item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TodoItem' }
        '400':
          description: The update is invalid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Missing or invalid sign-in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No such todo item of the caller's
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: deleteMyTodoItem
      summary: Delete a todo item of the caller's
      security:
        - oauth2: [todos:write]
      parameters:
        - name: todoItemId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: The todo item was deleted
        '401':
          description: Missing or invalid sign-in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No such todo item of the caller's
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
